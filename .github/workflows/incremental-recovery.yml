name: Apply incremental recovery
on:
  push:
    branches: [feat/incremental-review-scopes]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/incremental-review-scopes
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply checked recovery fix
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/recovery.patch"
          echo '4eef1305ebf52dda7720292c4148cc0bc7c78371502145b62fd8375849a6f8ee  '"$RUNNER_TEMP/recovery.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/recovery.patch"
          git apply --index "$RUNNER_TEMP/recovery.patch"
          git rm .github/workflows/incremental-recovery.yml
      - run: npm ci
      - run: npm run check
      - name: Commit recovery fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: allow scoped reviews to recover from damaged history'
          git push origin HEAD:feat/incremental-review-scopes
