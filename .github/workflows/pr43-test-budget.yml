name: Adjust PR 43 regression budget
on:
  push:
    branches: [feat/incremental-review-scopes]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/incremental-review-scopes
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update only the installed workflow's harness budget
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "9626bceffd10ba9019b02f1c8a5882d10cfbaa74"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          file = Path('test/review.test.mjs')
          data = file.read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == '6f26cfa47c43fe3487afba85dbde9426758256e2'
          text = data.decode('utf-8')
          before = '  { timeout: 180000 },'
          assert text.count(before) == 1
          file.write_text(text.replace(before, '  { timeout: 240000 },'), encoding='utf-8')
          PY
          node --check test/review.test.mjs
          git rm .github/workflows/pr43-test-budget.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/review.test.mjs
          git commit -m 'test: allow the expanded installed workflow to finish'
          git push origin HEAD:feat/incremental-review-scopes
