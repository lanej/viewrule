name: Prepare Viewrule 0.7.0
on:
  push:
    branches: [release/v0.7.0]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare version and release documentation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const json = (file) => JSON.parse(readFileSync(file, 'utf8'));
          const save = (file, value) => writeFileSync(file, JSON.stringify(value, null, 2) + '\n');
          const edit = (file, from, to) => {
            const original = readFileSync(file, 'utf8');
            assert.ok(original.includes(from), `Missing expected release text in ${file}`);
            writeFileSync(file, original.replace(from, to));
          };
          const pkg = json('package.json');
          assert.equal(pkg.version, '0.6.0');
          pkg.version = '0.7.0';
          save('package.json', pkg);
          save(`${process.env.RUNNER_TEMP}/previous-shrinkwrap.json`, json('npm-shrinkwrap.json'));
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          assert.ok(changelog.startsWith('# Changelog\n\n## Unreleased\n'));
          const previous = changelog.indexOf('## 0.6.0 —');
          assert.ok(previous > 0);
          const notes = `# Changelog

          ## 0.7.0 — 2026-09-17

          - Add native include/exclude globs for source files, project documents, and
            logical page/viewport selection, with deterministic resolution and a read-only
            \`plan\` command. Preserve legacy recursive directory prefixes and exact citations.
          - Add explicit review scopes and dependency fan-out, plus opt-in
            \`plan --incremental\` and \`check --incremental\`. Full review remains the default;
            \`check --full\` always executes all configured obligations.
          - Reuse only verified complete evidence with original provenance, an explicit
            environment identity, and bounded age. Recompute cross-state constraints over
            fresh and reused observations; missing, corrupt, expired, and unknown evidence
            conservatively triggers new work or blocks a pass.
          - Fix source identity for symlink retargeting, global authentication invalidation,
            checkpoint ownership, damaged-report recovery, and canonical plan/check rule
            ordering. Preserve byte-only checksums for copied evidence artifacts.
          - Require authored \`DESIGN.md\` content for newly initialized projects and explicit
            document adoption. Add safe scaffolding and the \`/viewrule:design\` authoring
            workflow without rewriting existing design prose, rules, or approvals.
          - Publish per-rule Markdown and a machine-readable public rule catalog; add
            offline \`guide rules\` and \`guide DR-006\` lookup from the installed engine.
          - Publish the related-tools comparison and refresh the repository branding.
          - Update Claude plugin 0.7.0 to the checksummed 0.7.0 engine archive.

          Compatibility and upgrade: Node.js 22.18+ remains required; configuration/report
          schema v1, legacy aliases, and opt-in enforcement are preserved. Rerun a full
          review after upgrading because engine/input identity changes invalidate prior
          freshness. Existing projects without explicit document adoption retain optional
          discovery; explicitly configured design documents must be authored, not unfinished
          scaffolds. No application rules or human approvals are rewritten.

          Incremental reuse requires explicit dependency ownership and \`evidenceReuse\`
          settings (\`environmentKey\` and \`maxAgeMs\`). Keep the nonsecret environment key
          aligned with the running build, remote data, flags, fonts, and authentication.
          Unknown dependencies broaden execution. The recorded synthetic workload demonstrates
          avoided checks, not generalized production latency, token, or dollar-cost savings.
          See [incremental review](docs/incremental-review.md) and
          [design-document adoption](docs/project-documents.md).

          `;
          writeFileSync('CHANGELOG.md', notes.replace(/^          /gm, '') + changelog.slice(previous));
          edit('README.md', '**Status:** experimental 0.6.0', '**Status:** experimental 0.7.0');
          edit('README.md', '## Incremental review (unreleased)', '## Incremental review');
          edit('README.md', 'Download `viewrule-0.6.0.tgz` and `SHA256SUMS` from the\n[v0.6.0 release](https://github.com/lanej/viewrule/releases/tag/v0.6.0).', 'Download `viewrule-0.7.0.tgz` and `SHA256SUMS` from the\n[v0.7.0 release](https://github.com/lanej/viewrule/releases/tag/v0.7.0).');
          edit('README.md', 'npm install --global ./viewrule-0.6.0.tgz', 'npm install --global ./viewrule-0.7.0.tgz');
          edit('README.md', 'Viewrule 0.6.0 includes pinned Impeccable source diagnostics.', 'Viewrule 0.7.0 includes pinned Impeccable source diagnostics.');
          edit('docs/incremental-review.md', 'This feature is in the unreleased engine; it does not change the published plugin\nengine pin or install/upgrade anything from a hook.', 'This feature ships in engine 0.7.0. The 0.7.0 Claude plugin pins that release;\nupdate the plugin and run setup to adopt it. Hooks never install or upgrade software.');
          edit('docs/comparison.md', '## Which problem are you solving?', '> Release update: Viewrule 0.7.0 adds native globs, read-only planning, and opt-in\n> [dependency-aware incremental evidence reuse](incremental-review.md). The upstream\n> comparisons and historical experiments below retain their stated review scope.\n\n## Which problem are you solving?');
          edit('docs/comparison.md', 'The source changelog lists globs and `plan` as unreleased and explicitly says they do not enable incremental runs. Do not claim incremental execution or demonstrated cost savings.', 'At the inspected commit, globs and `plan` were unreleased and did not enable incremental runs. Release 0.7.0 now adds opt-in [incremental execution](incremental-review.md); its synthetic avoided-work observations do not establish production or end-to-end agent cost savings.');
          edit('plugins/claude-code/README.md', 'Version 0.6.0 pins the 0.6.0 engine, including bundled Impeccable source diagnostics,\n`lint`, decision-surface checks, project design/style contracts, and interaction checkpoints.', 'Version 0.7.0 pins the 0.7.0 engine, including native globs, read-only planning,\nopt-in incremental evidence reuse, authored design contracts, and offline rule lookup.\nBundled Impeccable source diagnostics, `lint`, decision-surface checks, and interaction\ncheckpoints remain available. Full review is still the default; see the engine\n[scope and reuse configuration](../../docs/incremental-review.md) before enabling reuse.');
          edit('plugins/claude-code/README.md', '| `/viewrule:review` |', '| `/viewrule:design` | Author the project design contract before substantive UI implementation |\n| `/viewrule:review` |');
          edit('plugins/claude-code/README.md', 'The pinned 0.6.0 engine includes the gallery assets.', 'The pinned 0.7.0 engine includes the gallery assets and canonical rule Markdown.\nUse `viewrule guide rules` for the rule index and `viewrule guide DR-006` for an\nindividual rule after setup.');
          const plugin = json('plugins/claude-code/.claude-plugin/plugin.json');
          assert.equal(plugin.version, '0.6.2');
          plugin.version = '0.7.0';
          save('plugins/claude-code/.claude-plugin/plugin.json', plugin);
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const previous = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/previous-shrinkwrap.json`));
          previous.version = previous.packages[''].version = '0.7.0';
          assert.deepEqual(JSON.parse(readFileSync('npm-shrinkwrap.json')), previous, 'Release must not change pinned dependencies');
          NODE
      - run: npm ci
      - name: Validate metadata and derive immutable archive pin
        shell: bash
        run: |
          npx --no-install prettier --write package.json npm-shrinkwrap.json plugins/claude-code/.claude-plugin/plugin.json
          npm run check
          npm run site:build
          mkdir -p "$RUNNER_TEMP/release-candidate" "$RUNNER_TEMP/repack"
          npm pack --json --pack-destination "$RUNNER_TEMP/release-candidate" > "$RUNNER_TEMP/pack.json"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const [packed] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/pack.json`));
          assert.equal(packed.version, '0.7.0');
          assert.equal(packed.filename, 'viewrule-0.7.0.tgz');
          for (const file of packed.files) assert.ok(!/^(\.github\/|plugins\/claude-code\/(engine\.json|\.claude-plugin\/))/.test(file.path), `Unexpected package file ${file.path}`);
          const sha256 = createHash('sha256').update(readFileSync(`${process.env.RUNNER_TEMP}/release-candidate/${packed.filename}`)).digest('hex');
          const pin = { version: '0.7.0', url: 'https://github.com/lanej/viewrule/releases/download/v0.7.0/viewrule-0.7.0.tgz', sha256 };
          writeFileSync('plugins/claude-code/engine.json', JSON.stringify(pin, null, 2) + '\n');
          writeFileSync(`${process.env.RUNNER_TEMP}/release-candidate/pin.json`, JSON.stringify(pin, null, 2) + '\n');
          console.log(`Candidate archive SHA-256: ${sha256}`);
          NODE
          npm pack --json --pack-destination "$RUNNER_TEMP/repack" > /dev/null
          cmp "$RUNNER_TEMP/release-candidate/viewrule-0.7.0.tgz" "$RUNNER_TEMP/repack/viewrule-0.7.0.tgz"
          git diff --check
      - name: Commit release metadata and remove temporary preparation workflow
        shell: bash
        run: |
          git add package.json npm-shrinkwrap.json CHANGELOG.md README.md docs/incremental-review.md docs/comparison.md plugins/claude-code/README.md plugins/claude-code/.claude-plugin/plugin.json plugins/claude-code/engine.json
          git rm .github/workflows/prepare-v070.yml
          git diff --cached --stat
          git diff --cached > "$RUNNER_TEMP/release-candidate/metadata.patch"
          test -z "$(git diff --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: prepare Viewrule 0.7.0 release and verified archive pin'
          git push origin HEAD:release/v0.7.0
      - uses: actions/upload-artifact@v4
        with:
          name: v070-release-candidate
          path: ${{ runner.temp }}/release-candidate/
          retention-days: 7
          if-no-files-found: error
