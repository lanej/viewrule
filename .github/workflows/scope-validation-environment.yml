name: Scope validation environment
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'feat/native-glob-scopes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
      - name: Preserve public source and pinned tools for local validation
        run: |
          cp "$(command -v node)" "$RUNNER_TEMP/validation-node"
          tar -czf "$RUNNER_TEMP/scope-validation.tar.gz" --exclude=./.git --exclude=./dist .
          mv "$RUNNER_TEMP/validation-node" .
          gzip validation-node
      - uses: actions/upload-artifact@v4
        with:
          name: scope-validation-environment
          path: |
            ${{ runner.temp }}/scope-validation.tar.gz
            validation-node.gz
          retention-days: 1
          if-no-files-found: error
