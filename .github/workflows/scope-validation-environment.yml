name: Scope validation environment
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'feat/native-glob-scopes' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-glob-scopes
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply the locally validated implementation
        shell: bash
        run: |
          gzip -dc .github/native-glob.patch.gz > "$RUNNER_TEMP/native-glob.patch"
          echo "328491fe88857152e1d8913bd1c24dd87b042e1641b68e866cd813fa1e276a2a  $RUNNER_TEMP/native-glob.patch" | sha256sum --check
          git apply --ignore-whitespace --check "$RUNNER_TEMP/native-glob.patch"
          git apply --ignore-whitespace "$RUNNER_TEMP/native-glob.patch"
      - run: npm ci
      - run: npm run format
      - run: npm run check
      - name: Commit source changes and remove temporary transport
        shell: bash
        run: |
          rm .github/native-glob.patch.gz .github/workflows/scope-validation-environment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md docs package.json npm-shrinkwrap.json src test .github
          git commit -m 'feat: native glob scopes and read-only review plans'
          git push origin HEAD:refs/heads/feat/native-glob-scopes
