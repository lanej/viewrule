name: DR-013 emphasis authoring
on:
  pull_request:
    types: [labeled]
permissions:
  contents: write
jobs:
  evidence:
    if: github.event.label.name == 'capture-dr013-emphasis' && github.head_ref == 'refine/dr-013-example-isolation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
      - name: Complete fixture integration and format authored files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          const replaceOnce = (source, from, to) => {
            assert.equal(source.split(from).length, 2, `Expected unique source fragment: ${from}`);
            return source.replace(from, to);
          };
          const testPath = 'test/review.test.mjs';
          let test = await readFile(testPath, 'utf8');
          test = replaceOnce(test, '"behavior.js",\n            "behavior.css",', '"behavior.js",\n            "priority-scene.js",\n            "behavior.css",');
          test = replaceOnce(test, 'import { chromium } from "playwright";', 'import { chromium } from "playwright";\nimport { inspectPage } from "../src/checks.mjs";');
          const nativeCheck = `      await choose("DR-013");
                const integratedPriorityRules = JSON.parse(
                  await readFile(path.join(exampleDirectory, "priority-rules.json"), "utf8"),
                );
                for (const quality of ["good", "bad"]) {
                  const measured = await page.evaluate(inspectPage, integratedPriorityRules.map((rule) => ({
                    ...rule,
                    selector: rule.selector.split(",").map((selector) => "#" + quality + " " + selector.trim()).join(", "),
                  })));
                  assert.deepEqual(
                    measured.findings.map((finding) => finding.rule).sort(),
                    quality === "good" ? [] : ["priority-response-surface", "priority-response-type", "priority-total-surface", "priority-total-type"],
                    "The integrated canonical page must satisfy the same native priority contract",
                  );
                  assert.ok(measured.metrics.evaluations.every((entry) => entry.status === "checked"));
                }
          `;
          test = replaceOnce(test, '      await choose("DR-013");\n', nativeCheck);
          await writeFile(testPath, test);
          const sitePath = 'scripts/site.mjs';
          let site = await readFile(sitePath, 'utf8');
          site = replaceOnce(site, '"behavior.js",\n  "behavior.css",', '"behavior.js",\n  "priority-scene.js",\n  "behavior.css",');
          await writeFile(sitePath, site);
          const cssPath = 'docs/examples/behavior.css';
          const css = await readFile(cssPath, 'utf8');
          const marker = css.indexOf('/* DR-013:');
          assert.ok(marker >= 0);
          let priority = css.slice(marker);
          priority = replaceOnce(priority, 'padding: 1.5em;\n  font-size: 1rem;', 'padding: 1.5em;\n  font-size: max(1rem, 16px);');
          priority = replaceOnce(priority, 'font-size: 1.25rem;', 'font-size: max(1.25rem, 20px);');
          priority = replaceOnce(priority, 'min-width: 2.75rem;', 'min-width: max(2.75rem, 44px);');
          priority = replaceOnce(priority, 'min-height: 2.75rem;', 'min-height: max(2.75rem, 44px);');
          await writeFile(cssPath, css.slice(0, marker) + priority);
          const catalogPath = 'docs/examples/behavior-catalog.json';
          const catalog = JSON.parse(await readFile(catalogPath, 'utf8'));
          const recovery = catalog.rules.find(rule => rule.id === 'DR-012');
          recovery.verification = recovery.verification.replace('Entered value is outside the allowed range.', 'Enter 6% or less.');
          catalog.rules.find(rule => rule.id === 'DR-016').exception = 'An explicitly ordered category set can justify a different encoding when explained.';
          await writeFile(catalogPath, JSON.stringify(catalog, null, 2) + '\n');
          NODE
          npx --no-install prettier --write docs/examples/priority-rules.json docs/examples/priority-before.json docs/examples/priority-checkpoint.mjs docs/examples/priority-scene.js docs/examples/behavior.css docs/examples/behavior.html docs/examples/behavior-catalog.json docs/examples/conformance-matrix.json scripts/test-package.mjs scripts/site.mjs test/review.test.mjs
      - run: npm run lint
      - run: npm run analyze
      - run: npm run guide:check
      - run: node bin/viewrule.mjs install-browser --with-deps
      - run: npm test
      - name: Publish this capture set once
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          source_commit="$(git rev-parse HEAD)"
          destination="docs/examples/images/behavior/review"
          mkdir -p "$destination"
          for quality in good bad; do
            for viewport in desktop mobile; do
              cp "dist/behavior-evidence/dr-013-$quality-$viewport.png" "$destination/dr-013-emphasis-$quality-$viewport.png"
            done
          done
          cp dist/behavior-evidence/dr-013-evidence.json "$destination/dr-013-emphasis-evidence.json"
          npx --no-install prettier --write "$destination/dr-013-emphasis-evidence.json"
          git diff --quiet -- .github/workflows
          git fetch origin "$HEAD_REF"
          test "$(git rev-parse FETCH_HEAD)" = "$source_commit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add "$destination"/dr-013-emphasis-*.png "$destination/dr-013-emphasis-evidence.json"
          git commit -m "Record tested DR-013 emphasis evidence and fixture integration"
          git push origin "HEAD:$HEAD_REF"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: dr013-emphasis-authoring
          path: dist/behavior-evidence/
          if-no-files-found: warn
          retention-days: 7
