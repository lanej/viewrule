name: Finalize composition branch
on:
  push:
    branches: [chatgpt/composition-finalize-20260924]
    paths: [.github/workflows/finalize-composition.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
      - name: Update concrete policy-count expectation
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'test/review.test.mjs';
          const before = readFileSync(file, 'utf8');
          const old = 'assert.equal(behaviorReport.designPolicy.rules.length, 16);';
          if (before.split(old).length !== 2) throw new Error('Expected exactly one policy-count assertion');
          writeFileSync(file, before.replace(old, 'assert.equal(behaviorReport.designPolicy.rules.length, 20);'));
          const log = 'CHANGELOG.md';
          const text = readFileSync(log, 'utf8');
          const claim = 'application rules, presets, schema versions, approvals, and plugin pins are';
          if (text.split(claim).length !== 2) throw new Error('Expected one compatibility statement');
          writeFileSync(log, text.replace(claim, 'application rules, baseline/analytical contracts, schema versions, approvals, and plugin pins are'));
          JS
      - run: npm run format
      - name: Commit formatted integration and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/finalize-composition.yml
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const branch = 'chatgpt/composition-finalize-20260924';
          if (process.env.GITHUB_REF_NAME !== branch || process.env.GITHUB_REPOSITORY !== 'lanej/viewrule') throw new Error('Unexpected publication scope');
          const git = (...args) => execFileSync('git', args, {encoding:'utf8'}).trim();
          const parent = git('rev-parse', 'HEAD');
          const baseTree = git('rev-parse', 'HEAD^{tree}');
          const api = async (endpoint, method, data) => {
            const response = await fetch(`https://api.github.com/repos/lanej/viewrule/${endpoint}`, {
              method, headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'},
              body: data === undefined ? undefined : JSON.stringify(data)
            });
            if (!response.ok) throw new Error(`${method} ${endpoint}: ${response.status} ${await response.text()}`);
            return response.json();
          };
          const current = await api(`git/ref/heads/${branch}`, 'GET');
          if (current.object.sha !== parent) throw new Error('Branch advanced; refusing to overwrite');
          const files = git('diff', '--name-only', '-z').split('\0').filter(Boolean);
          const tree = [];
          for (const file of files) {
            if (file === '.github/workflows/finalize-composition.yml') {
              tree.push({path:file,mode:'100644',type:'blob',sha:null});
              continue;
            }
            const blob = await api('git/blobs', 'POST', {content:readFileSync(file, 'utf8'),encoding:'utf-8'});
            tree.push({path:file,mode:'100644',type:'blob',sha:blob.sha});
          }
          const nextTree = await api('git/trees', 'POST', {base_tree:baseTree,tree});
          const commit = await api('git/commits', 'POST', {message:'Format composition implementation and update policy-count expectation',tree:nextTree.sha,parents:[parent]});
          await api(`git/refs/heads/${branch}`, 'PATCH', {sha:commit.sha,force:false});
          console.log(`Published ${commit.sha} (${files.length} files) to ${branch}`);
          JS
