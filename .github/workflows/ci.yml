name: Viewrule regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
      - run: npm run check
      - run: node bin/viewrule.mjs install-browser --with-deps
      - run: npm test
        env:
          VIEWRULE_VERIFY_PLUGIN_PIN: ${{ contains(github.event.pull_request.title, '[release]') || contains(github.event.head_commit.message, '[release]') }}
      - uses: actions/upload-artifact@v4
        with:
          name: tested-package
          path: dist/viewrule-*.tgz
          if-no-files-found: error
          retention-days: 7
  release:
    needs: regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
