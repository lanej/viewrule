name: Viewrule regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
      - name: Temporary landing-page formatter diagnostic
        run: |
          npx prettier docs/index.html > /tmp/landing.formatted.html
          diff -u docs/index.html /tmp/landing.formatted.html || true
      - run: npm run check
      - run: node bin/viewrule.mjs install-browser --with-deps
      - run: npm test
        env:
          VIEWRULE_VERIFY_PLUGIN_PIN: ${{ contains(github.event.pull_request.title, '[release]') || contains(github.event.head_commit.message, '[release]') }}
      - uses: actions/upload-artifact@v4
        with:
          name: tested-package
          path: dist/viewrule-*.tgz
          if-no-files-found: error
          retention-days: 7
  release:
    needs: regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
  pages:
    needs: regression
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/site.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy documentation and mock application
        id: deployment
        uses: actions/deploy-pages@v4
