name: Viewrule regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
        id: dependencies
      - name: Check formatting
        id: formatting
        run: npm run format:check
      - name: Show required formatting changes
        if: failure() && steps.formatting.outcome == 'failure'
        shell: bash
        run: |
          status=0
          npx --no-install prettier --list-different . > "$RUNNER_TEMP/prettier-files.txt" || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          while IFS= read -r file; do
            npx --no-install prettier "$file" > "$RUNNER_TEMP/prettier-expected.txt"
            diff_status=0
            diff -u --label "a/$file" --label "b/$file" "$file" "$RUNNER_TEMP/prettier-expected.txt" || diff_status=$?
            if [ "$diff_status" -gt 1 ]; then exit "$diff_status"; fi
          done < "$RUNNER_TEMP/prettier-files.txt"
      - name: Check lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run lint
      - name: Check types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run analyze
      - name: Check guide and example sources
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run guide:check
      - name: Build public site
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run site:build
      - run: node bin/viewrule.mjs install-browser --with-deps
      - run: npm test
        env:
          VIEWRULE_VERIFY_PLUGIN_PIN: ${{ contains(github.event.pull_request.title, '[release]') || contains(github.event.head_commit.message, '[release]') }}
      - uses: actions/upload-artifact@v4
        with:
          name: tested-package
          path: dist/viewrule-*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Benchmark analytical detectors
        id: benchmark
        run: npm run benchmark
      - name: Preserve benchmark evidence
        if: ${{ !cancelled() && steps.benchmark.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: analytical-benchmark
          include-hidden-files: true
          path: |
            dist/review-evidence/
            dist/benchmark/summary.md
            dist/benchmark/results.json
            dist/benchmark/*/page.html
            dist/benchmark/*/checkpoint.mjs
            dist/benchmark/*/.ui-review/
          if-no-files-found: error
          retention-days: 7
  release:
    needs: regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
  pages:
    needs: regression
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run site:build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy documentation and mock application
        id: deployment
        uses: actions/deploy-pages@v4
