name: Viewrule regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
        id: dependencies
      - name: Apply formatting
        id: formatting
        run: npm run format
      - name: Commit formatting-only changes
        id: format-commit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --exit-code --quiet && {
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          git commit -m "Apply Prettier formatting"
          git fetch origin "$HEAD_REF"
          git rebase "origin/$HEAD_REF"
          git push origin "HEAD:$HEAD_REF"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Formatting commit pushed
        if: steps.format-commit.outputs.pushed == 'true'
        run: echo "Formatting-only changes were committed to the PR branch; continue validating this already-formatted working tree without restarting CI."
      - name: Check lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success'  }}
        run: npm run lint
      - name: Check types
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success'  }}
        run: npm run analyze
      - name: Check guide and example sources
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success'  }}
        run: npm run guide:check
      - name: Build public site
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success'  }}
        run: npm run site:build
      - run: node bin/viewrule.mjs install-browser --with-deps
      - run: npm test
        env:
          VIEWRULE_VERIFY_PLUGIN_PIN: ${{ contains(github.event.pull_request.title, '[release]') || contains(github.event.head_commit.message, '[release]') }}
      - uses: actions/upload-artifact@v4
        with:
          name: tested-package
          path: dist/viewrule-*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Preserve behavior example evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: behavior-example-evidence
          path: dist/behavior-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve pattern review evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pattern-review-evidence
          path: dist/pattern-review-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Benchmark analytical detectors
        id: benchmark
        run: |
          npm run benchmark
          node scripts/repair-trial.mjs verify
      - name: Preserve benchmark evidence
        if: ${{ !cancelled() && steps.benchmark.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: analytical-benchmark
          include-hidden-files: true
          path: |
            dist/review-evidence/
            dist/repair-evaluator-validation.json
            dist/benchmark/summary.md
            dist/benchmark/results.json
            dist/benchmark/*/page.html
            dist/benchmark/*/checkpoint.mjs
            dist/benchmark/*/.ui-review/
          if-no-files-found: error
          retention-days: 7
  release:
    needs: regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
  pages:
    needs: regression
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run site:build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy documentation and mock application
        id: deployment
        uses: actions/deploy-pages@v4
