name: Assemble composition feature branch
on:
  push:
    branches: [feat/falsifiable-composition-rules]
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'lanej/viewrule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked source patch and remove one-use assembly files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/falsifiable-composition-rules"
          python3 .composition-assemble.py
          git rm .composition-assemble.py .composition-existing.patch .github/workflows/composition-assemble.yml
          git add src docs README.md test scripts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate falsifiable composition policy and viewport-growth checks"
          git push origin HEAD:feat/falsifiable-composition-rules
