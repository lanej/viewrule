name: Incremental validation environment
on:
  push:
    branches: [feat/incremental-review-scopes]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/incremental-review-scopes
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply exact locally checked implementation
        shell: bash
        run: |
          cat .incremental-patch.0 .incremental-patch.1 .incremental-patch.2 .incremental-patch.3 | xz -d > "$RUNNER_TEMP/implementation.patch"
          echo '422ed4ba8693b181874aa00d71be275dc7fcd2fdbd213fd3e9ecadb54ef771eb  '"$RUNNER_TEMP/implementation.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/implementation.patch"
          git apply --index "$RUNNER_TEMP/implementation.patch"
          git rm .incremental-patch.0 .incremental-patch.1 .incremental-patch.2 .incremental-patch.3 .github/workflows/incremental-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: dependency-aware scoped reviews and verified evidence reuse'
          git push origin HEAD:feat/incremental-review-scopes
      - run: npm ci
      - run: npm run check
      - run: npm run site:build
      - run: node bin/viewrule.mjs install-browser --with-deps
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incremental-validation-results
          path: |
            dist/review-evidence/incremental-workload.json
            dist/viewrule-*.tgz
          retention-days: 7
          if-no-files-found: warn
