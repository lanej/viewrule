name: Incremental validation environment
on:
  push:
    branches: [feat/incremental-review-scopes]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Preserve public source and pinned validation tools
        run: |
          mkdir -p .validation/bin .validation/lib
          cp "$(command -v node)" .validation/bin/node
          cp -R "$(npm root -g)/npm" .validation/lib/npm
          ln -s ../lib/npm/bin/npm-cli.js .validation/bin/npm
          ln -s ../lib/npm/bin/npx-cli.js .validation/bin/npx
          git rev-parse HEAD > .validation/source-commit
          tar -czf "$RUNNER_TEMP/incremental-validation.tar.gz" --exclude=./.git --exclude=./dist .
      - uses: actions/upload-artifact@v4
        with:
          name: incremental-validation-environment
          path: ${{ runner.temp }}/incremental-validation.tar.gz
          retention-days: 1
          if-no-files-found: error
