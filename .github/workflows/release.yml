name: Release
on:
  workflow_call:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: tested-package
          path: dist
      - name: Read release version
        run: node --input-type=module -e 'import p from "./package.json" with {type:"json"}; import {appendFileSync,accessSync} from "node:fs"; if (!/^\d+\.\d+\.\d+$/.test(p.version)) throw new Error("Expected a release version"); accessSync(`dist/viewrule-${p.version}.tgz`); appendFileSync(process.env.GITHUB_ENV, `RELEASE_TAG=v${p.version}\n`);'
      - name: Checksum tested archive
        working-directory: dist
        run: sha256sum viewrule-*.tgz > SHA256SUMS
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/viewrule-*.tgz dist/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title "Viewrule $RELEASE_TAG" --notes-file CHANGELOG.md
