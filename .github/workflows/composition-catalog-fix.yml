name: Update composition catalog assertions
on:
  push:
    branches: [feat/falsifiable-composition-rules]
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'lanej/viewrule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/falsifiable-composition-rules
      - name: Update catalog assertions and record unassessed coverage
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/falsifiable-composition-rules"
          python3 - <<'PY'
          import json
          from pathlib import Path
          def replace(name, old, new, count=1):
              p = Path(name)
              text = p.read_text()
              assert text.count(old) == count, (name, old, text.count(old))
              p.write_text(text.replace(old, new))
          replace('test/design-contract.test.mjs', 'assert.equal(ruleIndex.rules.length, 16);', 'assert.equal(ruleIndex.rules.length, 20);')
          replace('test/review.test.mjs', 'assert.equal(contextSchema.properties.designRules.items.enum.length, 16);', 'assert.equal(contextSchema.properties.designRules.items.enum.length, 20);')
          replace('test/review.test.mjs', 'contextSchema.properties.designRules.items.enum.slice(8),', 'contextSchema.properties.designRules.items.enum.slice(8, 16),')
          replace('test/review.test.mjs', 'const registeredRules = contextSchema.properties.designRules.items.enum;', '''const registeredRules = contextSchema.properties.designRules.items.enum;
              assert.deepEqual(registeredRules.slice(16), ["DR-017", "DR-018", "DR-019", "DR-020"]);''')
          replace('test/review.test.mjs', '["pass", "fail", "not-applicable"]', '["pass", "fail", "not-applicable", "unassessed"]', 2)
          replace('test/review.test.mjs', 'if (assessment.good === "not-applicable")', 'if (["not-applicable", "unassessed"].includes(assessment.good))')
          replace('test/review.test.mjs', '${example.id}/${id} not-applicable needs rationale evidence', '${example.id}/${id} ${assessment.good} needs rationale evidence')
          p = Path('docs/examples/conformance-matrix.json')
          matrix = json.loads(p.read_text())
          descriptions = {
              'DR-017': 'No peer-alignment contract has been evaluated for this existing example. New composition checkpoint evidence does not retroactively certify this fixture.',
              'DR-018': 'No repeated-spacing contract has been evaluated for this existing example. New composition checkpoint evidence does not retroactively certify this fixture.',
              'DR-019': 'No finite evidence inventory or viewport-growth contract has been evaluated for this existing example. This is unassessed, not an occupancy failure or a pass.',
              'DR-020': 'Semantic peer balance has not been assessed for this existing example. Existing priority review is not approval under the new composition rule.',
          }
          for example in matrix['examples']:
              for rule, explanation in descriptions.items():
                  assert rule not in example['rules'], (example['id'], rule)
                  example['rules'][rule] = {'good': 'unassessed', 'bad': 'unassessed', 'evidence': explanation, 'evidenceType': 'rationale'}
          p.write_text(json.dumps(matrix, indent=2, ensure_ascii=False) + '\n')
          PY
          git rm .github/workflows/composition-catalog-fix.yml
          git add test/design-contract.test.mjs test/review.test.mjs docs/examples/conformance-matrix.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update 20-rule catalog coverage without claiming unassessed conformance"
          git fetch origin feat/falsifiable-composition-rules
          git rebase origin/feat/falsifiable-composition-rules
          git push origin HEAD:feat/falsifiable-composition-rules
