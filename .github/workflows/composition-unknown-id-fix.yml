name: Update unknown design-rule fixture
on:
  push:
    branches: [feat/falsifiable-composition-rules]
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'lanej/viewrule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/falsifiable-composition-rules
      - name: Keep the unknown-ID rejection fixture outside the registered catalog
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/falsifiable-composition-rules"
          python3 - <<'PY'
          from pathlib import Path
          edits = [
              ('test/review.test.mjs', 'JSON.stringify({ ...behaviorRules[0], designRules: ["DR-017"] })', 'JSON.stringify({ ...behaviorRules[0], designRules: ["DR-999"] })'),
              ('test/README.md', 'The schema accepts the sixteen registered IDs and rejects unknown DR-017.', 'The schema accepts the twenty registered IDs and rejects unknown DR-999.'),
          ]
          for name, old, new in edits:
              p = Path(name)
              text = p.read_text()
              assert text.count(old) == 1, (name, old)
              p.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/composition-unknown-id-fix.yml
          git add test/review.test.mjs test/README.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve unknown design-rule rejection after registering DR-017"
          git fetch origin feat/falsifiable-composition-rules
          git rebase origin/feat/falsifiable-composition-rules
          git push origin HEAD:feat/falsifiable-composition-rules
