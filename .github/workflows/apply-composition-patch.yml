name: Apply scoped composition patch
on:
  push:
    branches: [chatgpt/composition-economics-20260924]
    paths: [.viewrule-composition.patch]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/chatgpt/composition-economics-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply integration patch and remove temporary transport
        shell: bash
        run: |
          git apply --check .viewrule-composition.patch
          git apply .viewrule-composition.patch
          rm .viewrule-composition.patch .github/workflows/apply-composition-patch.yml
          git add -u
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Integrate composition policy, checks, and calibration'
          git push origin "HEAD:${GITHUB_REF_NAME}"
